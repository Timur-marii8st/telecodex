[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-local-codex"
version = "0.1.1"
description = "Local Telegram personal-account MCP connector and Codex setup CLI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "telegram-mcp @ git+https://github.com/chigwell/telegram-mcp.git@e55d9c7a66a8eb0855debb268a4ed5b63749af2d",
  "python-socks==3.1.1",
]

[project.scripts]
telegram-local = "telegram_local.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
